name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  android:
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KEYSTORE_FINGERPRINT: ED:A9:9D:99:5D:F4:5A:C8:AB:FC:D0:36:E5:84:40:84:0F:44:20:C9:2E:09:76:75:B6:01:31:9F:90:1C:F4:19
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Derive the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH with minor and patch below 100"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Point the build at the production backend
        run: grep -E '^EXPO_PUBLIC_[A-Z_]+=' .env.production >> "$GITHUB_ENV"

      - name: Restore Firebase config and the release key
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Generate the native project
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the signed APK
        working-directory: android
        env:
          NODE_ENV: production
          ORG_GRADLE_PROJECT_DEVHUB_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_DEVHUB_RELEASE_STORE_PASSWORD: ${{ secrets.DEVHUB_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_DEVHUB_RELEASE_KEY_ALIAS: ${{ secrets.DEVHUB_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_DEVHUB_RELEASE_KEY_PASSWORD: ${{ secrets.DEVHUB_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the signature and the backend it talks to
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          signer=$("$apksigner" verify --print-certs "$apk" | grep 'SHA-256 digest' | head -1 | awk '{print toupper($NF)}' | sed 's/../&:/g; s/:$//')
          if [ "$signer" != "$KEYSTORE_FINGERPRINT" ]; then
            echo "::error::APK is signed by $signer, not the DevHub release key"
            exit 1
          fi
          host="${EXPO_PUBLIC_API_URL#https://}"
          if ! unzip -p "$apk" assets/index.android.bundle | grep -aq "$host"; then
            echo "::error::the bundle does not reference $EXPO_PUBLIC_API_URL"
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/devhub-$VERSION.apk"
          (cd dist && sha256sum "devhub-$VERSION.apk" > "devhub-$VERSION.apk.sha256")
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "DevHub $VERSION" \
            --generate-notes \
            --notes "Android APK for sideloading. Talks to $EXPO_PUBLIC_API_URL. Not published to Google Play or the App Store."
